name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python install.py
      - run: pip install -e ".[dev]"
        working-directory: workspace
      - run: ruff check .
        working-directory: workspace
      - run: pytest -q
        working-directory: workspace
